name: tez_xizmat
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.2.3
  pinput: ^6.0.1
  iconly: ^1.0.1
  carousel_slider: ^5.1.1
  readmore: ^3.0.0
  image_picker: ^1.2.1
  dropdown_button2: ^2.3.9
  dio: ^5.9.0
  logger: ^2.6.2
  flutter_bloc: ^9.1.1
  get_it: ^9.2.0
  loading_indicator: ^3.1.1
  flutter_riverpod: ^3.1.0
  hive_flutter: ^1.1.0
  get_storage: ^2.1.1
  connectivity_plus: ^7.0.0
  internet_connection_checker: ^1.0.0+1
  equatable: ^2.0.8
  shimmer: ^3.0.0
  intl: ^0.20.2
  firebase_core: ^4.4.0
  firebase_messaging: ^16.1.1
  flutter_local_notifications: ^20.0.0
  web_socket_channel: ^3.0.3
  permission_handler: ^12.0.1
  flutter_launcher_icons: ^0.14.4
  device_info_plus:
  flutter_native_splash: ^2.4.1


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/splash/LOGOO.png"
  min_sdk_android: 21
  remove_alpha_ios: true

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^5.0.0


flutter:

  uses-material-design: true


  assets:
    - assets/splash/
    - assets/auth/
    - assets/bottom_nav_bar/
    - assets/home/
    - assets/circular_avatar/
    - assets/chat/
    - assets/profile/


